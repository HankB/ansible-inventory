---

# Copy the inventory file to any hosts in the inventory file that
# have Ansible installed
# Starting point courtesy of Google search.

- hosts: all
  tasks:
    - name: Check whether Ansible is installed on the target
      ansible.builtin.command: which ansible
      register: ansible_check
      failed_when: false
      changed_when: false

    - name: Deploy inventory
      block:
        - name: Ensure target directory exists
          ansible.builtin.file:
            path: /etc/ansible
            state: directory
            mode: "0755"
            owner: root
            group: root

        - name: Copy inventory to the global Ansible location
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/inventory"
            dest: /etc/ansible/inventory
            owner: root
            group: root
            mode: "0644"

      when: ansible_check.rc == 0
      become: true